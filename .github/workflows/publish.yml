name: Publish to pub.dev

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Export pub.dev OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://pub.dev');
            core.setSecret(token);
            core.exportVariable('PUB_TOKEN', token);

      - name: Configure pub.dev credentials
        run: dart pub token add https://pub.dev --env-var PUB_TOKEN

      - run: dart pub publish --force
