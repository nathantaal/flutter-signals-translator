name: Publish to pub.dev

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/unit_tests.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check versions and core constraints match the tag
        run: CHECK_ONLY=1 bash tool/publish.sh

      # Publishes core, waits for it on pub.dev, then the adapters against the
      # hosted core. Fetches a fresh OIDC token per publish and skips versions
      # already on pub.dev, so a failed run can simply be re-run.
      - name: Publish
        run: bash tool/publish.sh

  release:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag
