name: Publish to pub.dev

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/unit_tests.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze

      - name: Export pub.dev OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://pub.dev');
            core.setSecret(token);
            core.exportVariable('PUB_TOKEN', token);

      - name: Configure pub.dev credentials
        run: dart pub token add https://pub.dev --env-var PUB_TOKEN

      - run: dart pub publish --force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag
