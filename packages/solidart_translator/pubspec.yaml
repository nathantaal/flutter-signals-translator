name: solidart_translator
description: "JSON-based i18n with ICU message format for Flutter, powered by solidart. Same API as signals_translator."
version: 0.2.0
homepage: https://github.com/nathantaal/flutter-signals-translator
repository: https://github.com/nathantaal/flutter-signals-translator/tree/master/packages/solidart_translator

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  solidart: ^2.8.6
  signals_translator_core: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_solidart: ^2.7.4
  shared_preferences: ^2.5.6
  translator_conformance:
    path: ../../tool/translator_conformance
