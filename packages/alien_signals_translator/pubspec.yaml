name: alien_signals_translator
description: "JSON-based i18n with ICU message format for Flutter, powered by alien_signals. Same API as signals_translator."
version: 1.0.0
homepage: https://github.com/nathantaal/flutter-signals-translator
repository: https://github.com/nathantaal/flutter-signals-translator/tree/master/packages/alien_signals_translator

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  alien_signals: ^2.3.2
  signals_translator_core: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  oref: ^2.10.0
  shared_preferences: ^2.5.6
  translator_conformance:
    path: ../../tool/translator_conformance
